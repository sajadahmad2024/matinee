# Configuration for the package_rename tool.
# Update all placeholder values below with your actual app details before running the rename commands.
#
# Usage (run once per flavor):
#   dart run package_rename --flavour=dev
#   dart run package_rename --flavour=staging
#   dart run package_rename --flavour=prod

# ─── Dev ──────────────────────────────────────────────────────────────────────

package_rename_config-dev:
  android:
    app_name: My App Dev # Display name shown on the device
    package_name: com.example.myapp.dev # Android application ID
    override_old_package: com.geekyants.coe.template # Cleans up old folder structure
    lang: kotlin
  ios:
    app_name: My App Dev
    bundle_name: myapp-dev # Short bundle name (lowercase, no spaces)
    package_name: com.example.myapp.dev # iOS bundle identifier
  macos:
    app_name: My App Dev
    package_name: com.example.myapp.dev
    copyright_notice: Copyright © 2024 Your Organization. All rights reserved.
  web:
    app_name: My App Dev
    description: A Flutter application (dev).
  linux:
    app_name: My App Dev
    package_name: com.example.myapp.dev
    exe_name: myapp-dev
  windows:
    app_name: My App Dev
    organization: Your Organization
    copyright_notice: Copyright © 2024 Your Organization. All rights reserved.
    exe_name: myapp-dev

