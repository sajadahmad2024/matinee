name: hls_video_player
description: Native HLS caching bridge and portrait player UI.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  collection: ^1.18.0
  connectivity_plus: ^7.0.0
  flutter:
    sdk: flutter
  html: ^0.15.0
  meta: ^1.10.0
  video_player_platform_interface: ^6.9.0

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  mockito: ^5.4.4
  pigeon: ^27.3.2

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.videoplayer
        pluginClass: VideoPlayerPlugin
        dartPluginClass: AndroidVideoPlayer
      ios:
        pluginClass: VideoPlayerPlugin
        dartPluginClass: AVFoundationVideoPlayer
        sharedDarwinSource: true
      macos:
        pluginClass: VideoPlayerPlugin
        dartPluginClass: AVFoundationVideoPlayer
        sharedDarwinSource: true
