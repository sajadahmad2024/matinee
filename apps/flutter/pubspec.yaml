name: matinee
description: "Matinee Flutter application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  sentry_flutter: ^9.28.0
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.4.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  package_rename: ^1.10.1
  retrofit_generator: ^10.2.10
  swagger_parser: ^1.44.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans/DMSans-Black.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald/Oswald-Bold.ttf
          weight: 700
