name: template
description: "A Flutter cross-platform template project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  sentry_flutter: ^9.28.0
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.4.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  package_rename: ^1.10.1
  retrofit_generator: ^10.2.10
  swagger_parser: ^1.44.2

flutter:
  uses-material-design: true
  generate: true
